services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente antes de executar o Compose}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=oficina;Username=oficina;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente antes de executar o Compose}"
      Authentication__SigningKey: "${AUTHENTICATION_SIGNING_KEY:?Defina AUTHENTICATION_SIGNING_KEY no ambiente antes de executar o Compose}"
      Authentication__AdminUsername: "${AUTHENTICATION_ADMIN_USERNAME:?Defina AUTHENTICATION_ADMIN_USERNAME no ambiente antes de executar o Compose}"
      Authentication__AdminPassword: "${AUTHENTICATION_ADMIN_PASSWORD:?Defina AUTHENTICATION_ADMIN_PASSWORD no ambiente antes de executar o Compose}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
